name: update-regions
# Ежемесячно — рейтинги/высказывания; ежеквартально — верификация глав.
# Секрет ANTHROPIC_API_KEY добавить в Settings → Secrets and variables → Actions.
on:
  schedule:
    - cron: '0 5 1 * *'      # 1-го числа каждого месяца, 05:00 UTC — режим ratings
    - cron: '0 6 2 1,4,7,10 *' # 2-го числа января/апреля/июля/октября — режим verify
  workflow_dispatch:
    inputs:
      mode:
        description: 'ratings | verify'
        default: 'ratings'
      filter:
        description: 'full | all'
        default: 'full'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Determine mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            echo "filter=${{ github.event.inputs.filter }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 6 2 1,4,7,10 *" ]; then
            echo "mode=verify" >> $GITHUB_OUTPUT
            echo "filter=all" >> $GITHUB_OUTPUT
          else
            echo "mode=ratings" >> $GITHUB_OUTPUT
            echo "filter=full" >> $GITHUB_OUTPUT
          fi

      - name: Run updater
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update_bot.py --mode ${{ steps.m.outputs.mode }} --filter ${{ steps.m.outputs.filter }}

      - name: Commit & push if changed
        run: |
          git config user.name  "regions-bot"
          git config user.email "bot@users.noreply.github.com"
          git add regions.json
          git diff --cached --quiet || git commit -m "auto-update regions.json ($(date +%F), ${{ steps.m.outputs.mode }})"
          git push
